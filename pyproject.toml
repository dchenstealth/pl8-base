[project]
name = "on-my-plate"
version = "0.0.1"
description = "On My Plate, a lightweight issue tracker backed by DynamoDB"
readme = "README.md"
authors = [
    { name = "Daniel Chen", email = "danieljnchen@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "boto3~=1.43.40",
    "msgspec~=0.21.1",
]

[dependency-groups]
dev = [
    "moto~=5.2.2",
    "ruff~=0.15.20",
    "pytest~=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = [
    "src",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
